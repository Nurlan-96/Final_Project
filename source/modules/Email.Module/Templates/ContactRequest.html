<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Request</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 100%;
      max-width: 600px;
      margin: 50px auto;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .header {
      background-color: #e5efff;
      padding: 20px;
      text-align: center;
    }
    .header img {
      width: 40px;
    }
    .content {
      padding: 20px;
    }
    .content h1 {
      color: #4a4a4a;
      text-align: center;
    }
    .content p {
      color: #666666;
    }
    .details {
      margin-bottom: 15px;
    }
    .details span {
      font-weight: bold;
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://img.icons8.com/ios-filled/50/chat-message--v1.png" alt="Logo" />
    </div>
    <div class="content">
      <h1>New Contact Request</h1>
      <p>A new contact request has been submitted on your website.</p>
      <div class="details">
        <span>Name:</span>
        <span>{Name}</span>
      </div>
      <div class="details">
        <span>Email:</span>
        <span>{Email}</span>
      </div>
      <div class="details">
        <span>Subject:</span>
        <span>{Subject}</span>
      </div>
      <div class="details">
        <span>Message:</span>
        <p>{Message}</p>
      </div>
    </div>
  </div>
</body>
</html>
