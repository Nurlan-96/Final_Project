<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome {USERNAME} To EraTravel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 100%;
      max-width: 600px;
      margin: 50px auto;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .header {
      background-color: #e5efff;
      padding: 20px;
      text-align: center;
    }
    .header img {
      width: 40px;
    }
    .content {
      padding: 20px;
      text-align: center;
    }
    .content h1 {
      color: #4a4a4a;
    }
    .content p {
      color: #666666;
    }
    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 30px;
      background-color: #4e73df;
      color: #ffffff;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    .footer {
      margin-top: 20px;
      color: #aaaaaa;
      font-size: 12px;
      text-align: center;
    }
    .footer a {
      color: #4e73df;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://img.icons8.com/ios-filled/50/000000/handshake.png" alt="Handshake Icon"/>
    </div>
    <div class="content">
      <h1>Welcome to EraTravel!</h1>
      <p>We're excited to have you join our community.</p>
      <p>Thank you for choosing EraTravel. We're committed to providing you with [value proposition].</p>
      <div class="footer">
        <p>If you have any questions or need assistance, please don't hesitate to contact our support team at <a href="mailto:support@eratravel.az">support@eratravel.az</a></p>
      </div>
    </div>
  </div>
</body>
</html>
