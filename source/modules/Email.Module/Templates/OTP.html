<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 50px auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .header {
            background-color: #e5efff;
            padding: 20px;
            text-align: center;
        }
        .header img {
            width: 40px;
        }
        .content {
            padding: 20px;
            text-align: center;
        }
        .content h1 {
            color: #4a4a4a;
        }
        .content p {
            color: #666666;
        }
        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background-color: #4e73df;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .highlight {
            display: inline-block;
            margin-top: 5px;
            padding: 0; /* Remove padding */
            background-color: #4e73df;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            width: 100px; /* Set desired width */
            text-align: center; /* Center the content */ 
        }
        .highlight p {
            color: white;
        } 
        .footer {
            margin-top: 20px;
            color: #aaaaaa;
            font-size: 12px;
            text-align: center;
        }
        .footer a {
            color: #4e73df;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://img.icons8.com/ios-filled/50/000000/lock.png" alt="Lock Icon"/>
        </div>
        <div class="content">
            <h1>Forgot your password?</h1>
            <p>Hey, we received a request to reset your password.</p>
            <p>Your OTP Code:</p>
            <div class="highlight">
                <p><b>{OTP}</b></p>
            </div>
            <div class="footer">
                <p>The code will expire in 5 minutes.</p>
                <p>Do not share your code with anyone.<b>Including support team members of WeWork</b></p>
                <p>Didn't request a password reset? Contact our support team at <a href="mailto:nurlan.abasli96@gmail.com">nurlan.abasli96@gmail.com</a>.</p>
            </div>
        </div>
    </div>
</body>
</html>
