<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Your Account</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 100%;
      max-width: 600px;
      margin: 50px auto;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .header {
      background-color: #e5efff;
      padding: 20px;
      text-align: center;
    }
    .header img {
      width: 40px;
    }
    .content {
      padding: 20px;
      text-align: center;
    }
    .content h1 {
      color: #4a4a4a;
    }
    .content p {
      color: #666666;
    }
    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 30px;
      background-color: #4e73df;
      color: #ffffff;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer; 
    }
    .footer {
      margin-top: 20px;
      color: #aaaaaa;
      font-size: 12px;
      text-align: center;
    }
    .footer a {
      color: #4e73df;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://img.icons8.com/ios-filled/50/000000/user.png" alt="User Icon"/>
    </div>
    <div class="content">
      <h1>Welcome to WeWork!</h1>
      <p>Thank you for signing up. To complete your registration, please click the button below to confirm your account.</p>
      <a href="{CONFIRMATION_URL}" class="button">Confirm Account</a>
      <div class="footer">
        <p>If you didn't create an account with us, please ignore this email.</p>
        <p>For any questions, please contact our support team at <a href="mailto:nurlan.abasli96@gmail.com">nurlan.abasli96@gmail.com</a></p>
      </div>
    </div>
  </div>
</body>
</html>
